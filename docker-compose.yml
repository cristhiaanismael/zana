version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: zana_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zana_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: zana_user
      MYSQL_PASSWORD: zana_password
    # Tu PC (3308) apunta al contenedor MySQL (3306)
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: php:8.2-apache
    container_name: zana_laravel
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    # Tu PC (8082) apunta al contenedor Apache (80)
    ports:
      - "8082:80"
    depends_on:
      - db
    command: bash -c "sed -i 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf && a2enmod rewrite && docker-php-entrypoint apache2-foreground"

  frontend:
    image: node:20-alpine
    container_name: zana_react
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_data: